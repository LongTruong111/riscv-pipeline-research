name: Research Regression

on:
  push:
    branches:
      - "research/**"
      - "maintenance/**"
  pull_request:

jobs:
  week3-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog

      - name: Run frozen-DUT smoke regression
        run: make smoke

      - name: Verify regression did not mutate tracked evidence
        run: git diff --exit-code

  python-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Week 5 regression
        run: pytest research/week5/impl/tests -q

      - name: Week 6 regression
        run: pytest research/week6/tests -q

      - name: Week 7 regression
        run: pytest research/week7/tests -q

      - name: Week 8 regression
        run: pytest research/week8/tests -q
